services:
  - type: web
    name: gr8jeff-admin-api
    runtime: node
    rootDir: admin
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: ADMIN_ORIGINS
        sync: false
